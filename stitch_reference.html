about:{name:'VIJAYARAGAVAA V',role:'Aspiring RTL Design & Verification Engineer',inst:'RMK College of Eng. & Tech',spec:'Electronics – VLSI',focus:'Front-End Digital Design',hw:'Xilinx Artix-7 / Spartan FPGA',status:'AVAILABLE FOR INTERNSHIPS',disc:'Electronics & Communication (VLSI Specialization)',ptitle:'Silicon Engineering Philosophy',bio:'I am an electronics engineer intensely focused on the semiconductor domain. Rather than abstract high-level software, my passion lies in translating complex algorithmic specifications directly into optimized register-transfer level (RTL) architectures that operate deterministically at the silicon layer.\nI focus on timing closure, clock-domain crossing (CDC), minimal area footprints, and low-power dissipation, building digital blocks and FPGA implementations with verification-first discipline.',pr:'DETERMINISM | Synchronous state machine design with clean hazard-free transitions.\nROBUST CO-VERIFICATION | Self-checking directed testbenches with corner-case assertion coverage.\nPHYSICAL REALITY | Designing RTL with clear awareness of LUT utilization, wire delays & setup times.'},

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

<label>Email / Username<input id="u" autocomplete="username" required></label><label>Password<div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" id="tp">SHOW</button></div></label><div class="err" id="er"></div>
<button class="btn p" id="lb" style="justify-content:center">${first?'CREATE ACCESS →':'LOGIN →'}</button><a href="#" class="meta" style="text-align:center">← Back to portfolio</a>
<div class="meta" style="font-size:10px;line-height:1.5;text-transform:none">Prototype auth: credentials are stored as a hash in this browser only. The deployed build uses Supabase Auth + RLS.</div></form></div>`;
$('#tp').onclick=()=>{const p=$('#p'),s=p.type=='password';p.type=s?'text':'password';$('#tp').textContent=s?'HIDE':'SHOW'};
$('#lf').onsubmit=async e=>{e.preventDefault();const b=$('#lb'),u=$('#u').value.trim(),p=$('#p').value;b.textContent='AUTHENTICATING…';b.disabled=true;await new Promise(r=>setTimeout(r,500));const cr=getAuth();
try{if(!cr){if(p.length<8){$('#er').textContent='Use at least 8 characters.';b.disabled=false;b.textContent='CREATE ACCESS →';return}localStorage.setItem('vv_auth',JSON.stringify({u,h:await sha(p)}))}else if(cr.u!==u||cr.h!==await sha(p)){$('#er').textContent='Invalid credentials.';b.disabled=false;b.textContent='LOGIN →';return}
sessionStorage.setItem('vv_ok','1');location.hash='#/admin/dashboard'}catch(x){$('#er').textContent='Storage unavailable in this browser.';b.disabled=false}}}
let D,tab='dash';
const fieldsHtml=(spec,rec)=>spec.map(([k,l,t])=>{l=l||k[0].toUpperCase()+k.slice(1);const v=rec[k]||'';
if(t=='ta')return`<label>${l}<textarea name="${k}" rows="4">${E(v)}</textarea></label>`;
if(t=='img'||t=='pdf')return`<label>${l}<input type="file" data-k="${k}" data-t="${t}" accept="${t=='pdf'?'application/pdf':'image/*'}">${t=='img'&&v?`<img src="${v}" style="max-height:80px;margin-top:6px;border-radius:4px">`:v?'<span class="cy">File on record</span>':''}</label>`;
return`<label>${l}<input name="${k}" value="${E(v)}"></label>`}).join('');
function bind(form,spec,rec){form.querySelectorAll('input[type=file]').forEach(i=>i.onchange=()=>{const f=i.files[0];if(!f)return;const k=i.dataset.k;if(i.dataset.t=='img'){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);rec[k]=c.toDataURL('image/jpeg',.78);toast('Image ready — press Save')};im.src=r.result};r.readAsDataURL(f)}else{const r=new FileReader();r.onload=()=>{rec[k]=r.result;toast('PDF ready — press Save')};r.readAsDataURL(f)}})}
const collect=(form,spec,rec)=>spec.forEach(([k,,t])=>{if(!t||t=='ta')rec[k]=form.elements[k].value});

document.querySelector('.sb').onclick=e=>{const t=e.target.dataset.t;if(!t)return;if(t=='out'){sessionStorage.removeItem('vv_ok');location.hash='';return}tab=t;view()};view()}

if(tab=='dash'){m.innerHTML=`<h1>Dashboard</h1><p class="mu">Overview of published portfolio content.</p><div class="st">${[['TOTAL PROJECTS',D.projects.length],['TOTAL HACKATHONS',D.hackathons.length],['TOTAL CERTIFICATIONS',D.certs.length],['GALLERY ITEMS',D.gallery.length]].map(x=>`<div class="card"><b>${x[1]}</b><span class="meta">${x[0]}</span></div>`).join('')}</div><p style="margin-top:28px"><a class="btn o" href="#" target="_blank">View public site ↗</a></p>`;return}
if(tab=='settings'){m.innerHTML=`<h1>Site Settings</h1><p class="mu">Reset content or credentials for this prototype.</p><div class="row" style="margin-top:20px"><button class="btn d" id="rc">Reset all content to defaults</button><button class="btn d" id="ra">Reset admin credentials</button></div>`;

const edit=i=>{const rec=i<0?{}:JSON.parse(JSON.stringify(a[i]));const md=dlg(`<h3>${i<0?'Add':'Edit'} — ${s.t}</h3><form id="ef">${fieldsHtml(s.f,rec)}<div class="row"><button class="btn p">Save Changes</button><button type="button" class="btn" id="cx">Cancel</button></div></form>`);const f=md.querySelector('#ef');bind(f,s.f,rec);md.querySelector('#cx').onclick=()=>md.remove();f.onsubmit=e=>{e.preventDefault();collect(f,s.f,rec);if(i<0)a.push(rec);else a[i]=rec;md.remove();commit();view()}};

else if(k=='x'){const md=dlg(`<h3>Delete this entry?</h3><p class="mu">This cannot be undone.</p><div class="row" style="margin-top:16px"><button class="btn d" id="ok">Confirm delete</button><button class="btn" id="no">Cancel</button></div>`);md.querySelector('#no').onclick=()=>md.remove();md.querySelector('#ok').onclick=()=>{a.splice(i,1);md.remove();commit();view()};return}
